name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://autorelay:autorelay@localhost:5432/autorelay_test
      TEST_DATABASE_URL: postgresql+asyncpg://autorelay:autorelay@localhost:5432/autorelay_test
      FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:5173
      ALLOW_PRIVATE_ACTION_TARGETS: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autorelay_test
          POSTGRES_USER: autorelay
          POSTGRES_PASSWORD: autorelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autorelay -d autorelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        working-directory: backend
        run: python -m ruff format --check .

      - name: Lint
        working-directory: backend
        run: python -m ruff check .

      - name: Type check
        working-directory: backend
        run: python -m mypy app

      - name: Apply migrations to an empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  browser:
    name: Browser happy path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create ephemeral Compose environment
        run: python3 scripts/bootstrap_env.py

      - name: Validate sample-event helper
        run: python3 scripts/send_sample_event.py --help > /dev/null

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag autorelay-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag autorelay-frontend:ci ./frontend
